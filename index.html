<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandesh Backend</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.2), transparent 40%),
          linear-gradient(180deg, #020617 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        width: min(640px, 100%);
        padding: 32px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 24px;
        background: rgba(17, 24, 39, 0.92);
        box-shadow: 0 24px 80px rgba(2, 6, 23, 0.45);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p {
        margin: 0 0 16px;
        line-height: 1.6;
        color: var(--muted);
      }

      a {
        color: var(--accent);
      }

      code {
        color: var(--text);
        background: rgba(15, 23, 42, 0.9);
        padding: 2px 8px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sandesh Backend</h1>
      <p>This deployment is online.</p>
    </main>
  </body>
</html>
